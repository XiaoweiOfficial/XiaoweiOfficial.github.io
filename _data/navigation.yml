# The order of the links in the site header.
#
# Removing a link hides it from the header but does not remove the page itself.
# /publications/ is deliberately not listed: the single pre-doctoral article is
# shown in a section of the Research page instead, and the page is kept only so
# that any existing link to it still resolves.

main:
  - title: "Research"
    url: /research/

  - title: "Teaching"
    url: /teaching/

  - title: "CV"
    url: /cv/
